    <style>
      html { background: #000; }
      body { margin: 0; -webkit-tap-highlight-color: transparent; }
      #mcb-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 30%, #1a1608 0%, #000 70%); color: #FFD700; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 99998; }
      #mcb-splash .mcb-mark { width: 74px; height: 74px; border-radius: 22px; background: #FFD700; color: #000; font-weight: 900; font-size: 28px; letter-spacing: -1px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255, 215, 0, 0.35); animation: mcbPulse 1.6s ease-in-out infinite; }
      #mcb-splash .mcb-name { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
      #mcb-splash .mcb-tag { font-size: 11px; color: rgba(255, 215, 0, 0.65); letter-spacing: 1.5px; text-transform: uppercase; }
      #mcb-splash .mcb-bar { width: 120px; height: 3px; border-radius: 99px; background: rgba(255, 215, 0, 0.18); overflow: hidden; }
      #mcb-splash .mcb-bar span { display: block; width: 40%; height: 100%; background: #FFD700; border-radius: 99px; animation: mcbSlide 1.2s ease-in-out infinite; }
      @keyframes mcbPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes mcbSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
      #mcb-media-overlay { position: fixed; inset: 0; z-index: 99999; background: rgba(0, 0, 0, 0.93); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
      #mcb-media-overlay iframe { width: 100%; max-width: 820px; height: 78vh; border: none; border-radius: 14px; background: #000; }
      #mcb-media-close { background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; font-family: inherit; }

    <script type="module">
    // MCB FIX: Vercel has no /api/app-logs and no __b44Consent - old code hung here. Now local only.
    if (window.self === window.top) {
      let lastPath = "";
      function trackPageView() { const p = window.location.pathname; if (p === lastPath) return; lastPath = p; console.log('[MCB] Page:', p || 'home'); }
      const oP = history.pushState.bind(history); history.pushState = function(...a){ oP(...a); trackPageView(); };
      const oR = history.replaceState.bind(history); history.replaceState = function(...a){ oR(...a); trackPageView(); };
      window.addEventListener("popstate", trackPageView); trackPageView();
    }
    </script>
    <script>
    // MCB FIX: Kept your error logger, removed Base44 preview postMessage scripts that only work inside Base44 preview iframe. They were blocking Vercel.
    (function() {
        window.__mcb_errors = [];
        window.addEventListener('error', function(e) {
          var msg = (e.message || '') + ' ' + (e.filename || '') + ' ' + (e.target && (e.target.src || e.target.href) || '');
          if (msg.trim()) { window.__mcb_errors.push(msg.slice(0,500)); console.log('[MCB Error]', msg); }
        }, true);
        window.addEventListener('unhandledrejection', function(e) { window.__mcb_errors.push(String(e.reason || '').slice(0,500)); });
    })();
    </script>

    <!-- 2: MCB Install Button -->
    <button id="mcb-install-btn" style="display:none;position:fixed;bottom:20px;right:20px;z-index:9999;background:#FFD700;color:#000;font-weight:800;font-family:inherit;padding:12px 18px;border:none;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,0.28);">⬇ Install MCB SocialHub</button>
    <!-- ===== MCB SOCIALHUB INDEPENDENCE OVERRIDE - DO NOT REMOVE ===== -->
    <script>
      (function () {
        window.MCB_APP = { name: 'MCB SocialHub', version: '1.1', owner: 'MCB', independent: true, aiModel: 'gemini-3.8-flash', stats: { blocked: 0, rewritten: 0, fallbacks: 0 } };
        var _fetch = window.fetch;
        var MODEL_ALIASES = /gemini-2\.5-flash|gemini-2\.0-flash|gemini-3-flash|gemini-pro|gemini-1\.5-flash/gi;
        var NOISE_ONLY = /\/api\/app-logs\/|badge\.js|made-with|base44-badge/i;
        var AI_HOSTS = /generativelanguage\.googleapis\.com|\/api\/(apps\/[^/]+\/)?integrations|\/functions\//i;
        function modelRewrite(url, init) {
          try { var body = init && typeof init.body === 'string' ? init.body : null; var newUrl = url.replace(MODEL_ALIASES, 'gemini-3.8-flash'); var newBody = body ? body.replace(MODEL_ALIASES, 'gemini-3.8-flash') : null; if (newUrl === url && newBody === body) return null; return { url: newUrl, init: body ? Object.assign({}, init, { body: newBody }) : init }; } catch (err) { return null; }
        }
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || ''; var args = arguments;
          if (NOISE_ONLY.test(url)) { window.MCB_APP.stats.blocked++; console.log('[MCB] Ignored badge/telemetry call:', url); return Promise.resolve(new Response(JSON.stringify({ success: true, mcb: true, message: 'Handled by MCB SocialHub' }), { status: 200, headers: { 'Content-Type': 'application/json' } })); }
          if (AI_HOSTS.test(url)) { var rewrite = modelRewrite(url, init); if (rewrite) { window.MCB_APP.stats.rewritten++; return _fetch.call(this, rewrite.url, rewrite.init).then(function (res) { if (res && res.ok) return res; window.MCB_APP.stats.fallbacks++; return _fetch.apply(this, args); }.bind(this), function () { window.MCB_APP.stats.fallbacks++; return _fetch.apply(this, args); }.bind(this)); } }
          if (/\/login|\/register|\/auth/i.test(url)) window.MCB_APP.authTagged = 'MCB';
          return _fetch.apply(this, args);
        };
        var MEDIA_LINK = /youtube\.com|youtu\.be|tiktok\.com|facebook\.com|fb\.watch|instagram\.com|twitter\.com|x\.com|spotify\.com|soundcloud\.com/i;
        window.MCB_embedUrl = function (rawUrl) {
          var url = String(rawUrl || '').trim(); if (!/^https?:\/\//i.test(url)) return null;
          var yt = url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/);
          if (/youtube\.com|youtu\.be/i.test(url) && yt) return 'https://www.youtube.com/embed/' + yt[1] + '?autoplay=1&rel=0';
          if (/tiktok\.com/i.test(url)) { var tt = url.split('/video/')[1]; return tt ? 'https://www.tiktok.com/embed/v2/' + tt.split('?')[0] : null; }
          if (/facebook\.com|fb\.watch/i.test(url)) return 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(url) + '&show_text=false';
          if (/instagram\.com/i.test(url)) return url.split('?')[0].replace(/\/?$/, '/') + 'embed';
          if (/twitter\.com|x\.com/i.test(url)) return 'https://twitframe.com/show?url=' + encodeURIComponent(url);
          if (/open\.spotify\.com/i.test(url)) return url.replace('open.spotify.com/', 'open.spotify.com/embed/');
          if (/soundcloud\.com/i.test(url)) return 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + '&auto_play=true';
          return null;
        };
        window.MCB_playMedia = function (url) { return window.MCB_embedUrl(url) || url; };
        window.MCB_openMedia = function (rawUrl) {
          var embed = window.MCB_embedUrl(rawUrl); if (!embed) return false;
          var existing = document.getElementById('mcb-media-overlay'); if (existing) existing.remove();
          var overlay = document.createElement('div'); overlay.id = 'mcb-media-overlay';
          var close = document.createElement('button'); close.id = 'mcb-media-close'; close.type = 'button'; close.textContent = '✕ Close - Back to MCB SocialHub';
          var frame = document.createElement('iframe'); frame.src = embed; frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture'); frame.setAttribute('allowfullscreen', 'true'); frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
          var dismiss = function () { overlay.remove(); document.removeEventListener('keydown', onKey); };
          var onKey = function (e) { if (e.key === 'Escape') dismiss(); };
          close.addEventListener('click', dismiss); overlay.addEventListener('click', function (e) { if (e.target === overlay) dismiss(); }); document.addEventListener('keydown', onKey);
          overlay.appendChild(close); overlay.appendChild(frame); document.body.appendChild(overlay); return true;
        };
        document.addEventListener('click', function (e) { var anchor = e.target && e.target.closest ? e.target.closest('a[href]') : null; if (!anchor) return; var href = anchor.getAttribute('href') || ''; if (!MEDIA_LINK.test(href)) return; if (window.MCB_openMedia(href)) e.preventDefault(); }, true);
        document.addEventListener('click', function () { document.querySelectorAll('input[type="file"]').forEach(function (inp) { if (inp.hasAttribute('data-mcb-fixed')) return; inp.setAttribute('data-mcb-fixed', '1'); if (!inp.getAttribute('accept')) inp.setAttribute('accept', 'image/*,video/*'); }); }, true);
        var _clean = function () { try { document.querySelectorAll('body > a, body > div > a, body > section').forEach(function (el) { if (!el || !el.parentNode || el.id === 'root') return; if (el.closest('#root')) return; if (/made with|powered by base44/i.test(el.textContent || '')) el.remove(); }); document.querySelectorAll('#root [class*="made-with"], #root [id*="base44-badge"]').forEach(function (el) { el.remove(); }); } catch (err) {} };
        setInterval(_clean, 2000);
      })();
    </script>
    <!-- 2: install prompt + offline shell -->
    <script>
      var deferredPrompt;
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; document.getElementById('mcb-install-btn').style.display = 'block'; });
      document.getElementById('mcb-install-btn').addEventListener('click', async function () { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; document.getElementById('mcb-install-btn').style.display = 'none'; });
      window.addEventListener('appinstalled', function () { document.getElementById('mcb-install-btn').style.display = 'none'; });
      if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); }); }
    </script>

    <script>
      (function(){ function hide(){ var s=document.getElementById('mcb-splash'); if(s) s.style.display='none'; } setTimeout(hide, 4000); var c=setInterval(function(){ var r=document.getElementById('root'); if(r && r.querySelectorAll('div').length>1){ hide(); clearInterval(c); } },500); setTimeout(function(){ clearInterval(c); },10000); })();
